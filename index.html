<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soirées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #0b0b0b;
    color: #fff;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }

  #backdrop {
    position: absolute;
    inset: -8%;
    background-size: cover;
    background-position: center;
    filter: blur(34px) brightness(0.5) saturate(1.2);
    transform: scale(1.1);
  }

  #frame {
    position: absolute;
    inset: 0;
    margin: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: opacity 0.18s ease;
  }
  #frame.swap { opacity: 0; }

  #screens {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 1;
    color: #23201B;
  }
  #screens section {
    min-height: 100%;
    padding-top: calc(58px + env(safe-area-inset-top));
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }

  #placeholder {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 32px;
    text-align: center;
    background: #F6D9A6;
    color: #2C5F63;
  }
  #placeholder p {
    margin: 0;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    font-weight: 700;
  }
  #placeholder .big {
    font-family: 'Bowlby One SC', system-ui, sans-serif;
    font-size: clamp(46px, 15vw, 78px);
    line-height: .86;
    letter-spacing: -.01em;
  }

  .shade {
    position: absolute;
    left: 0;
    right: 0;
    height: 140px;
    pointer-events: none;
    z-index: 2;
  }
  .shade.top { top: 0; background: linear-gradient(rgba(0,0,0,0.55), transparent); }
  .shade.bottom { bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,0.45)); }

  .tap {
    position: absolute;
    top: 0;
    bottom: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 3;
  }
  .tap.left { left: 0; width: 32%; }
  .tap.right { right: 0; width: 68%; }

  #arrows {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: none;
    z-index: 4;
  }
  #arrows button {
    pointer-events: auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 0;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  #arrows button:disabled { opacity: 0.2; cursor: default; }

  #bars {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    gap: 4px;
    padding: calc(10px + env(safe-area-inset-top)) 12px 0;
    z-index: 5;
  }
  #bars span {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(127, 127, 127, 0.45);
  }
  #bars span.done { background: #fff; mix-blend-mode: difference; }

  header {
    position: absolute;
    top: calc(24px + env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 5;
  }
  #picker {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
    border: 0;
    border-radius: 999px;
    padding: 8px 14px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    color: #fff;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
  }
  #picker .chevron { font-size: 0.7em; opacity: 0.8; transition: transform 0.15s ease; }
  #picker[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  #caption {
    margin: 0;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #caption.dim { display: none; }

  #menu {
    position: absolute;
    top: calc(70px + env(safe-area-inset-top));
    left: 12px;
    z-index: 6;
    min-width: 210px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 6px;
    border-radius: 14px;
    background: rgba(22, 22, 22, 0.94);
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
  }
  #menu button {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 10px 12px;
    background: transparent;
    color: #fff;
    font: inherit;
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
  }
  #menu button[aria-current="true"] { background: rgba(255, 255, 255, 0.14); }
  #menu .sub { display: block; font-size: 0.78rem; opacity: 0.55; }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.95rem;
    z-index: 7;
  }
  #empty code {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 5px;
    padding: 2px 6px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="backdrop"></div>
  <img id="frame" alt="">
  <div id="screens" hidden></div>

  <div id="placeholder" hidden>
    <p id="placeholder-date"></p>
    <div class="big">À définir</div>
  </div>

  <div class="shade top"></div>
  <div class="shade bottom"></div>

  <button class="tap left" aria-label="Précédent"></button>
  <button class="tap right" aria-label="Suivant"></button>

  <div id="arrows" hidden>
    <button data-step="-1" aria-label="Précédent">&#8249;</button>
    <button data-step="1" aria-label="Suivant">&#8250;</button>
  </div>

  <div id="bars"></div>
  <header>
    <button id="picker" aria-expanded="false"><span id="picker-label"></span><span class="chevron">&#9660;</span></button>
    <p id="caption"></p>
  </header>
  <nav id="menu" hidden></nav>
</div>

<script>
const app = document.getElementById('app');
const backdrop = document.getElementById('backdrop');
const frame = document.getElementById('frame');
const screensHost = document.getElementById('screens');
const placeholder = document.getElementById('placeholder');
const placeholderDate = document.getElementById('placeholder-date');
const shades = document.querySelectorAll('.shade');
const taps = document.querySelectorAll('.tap');
const arrows = document.getElementById('arrows');
const bars = document.getElementById('bars');
const picker = document.getElementById('picker');
const pickerLabel = document.getElementById('picker-label');
const caption = document.getElementById('caption');
const menu = document.getElementById('menu');

const shortDate = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric' });
const longDate = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

const today = toISO(new Date());
const loaded = new Map();

let evenings = [];
let mode = 'images';
let stories = [];
let sections = [];
let allSections = [];
let index = 0;

fetch('photos.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(data => start(data.evenings || []))
  .catch(() => fail('Rien &agrave; afficher.<br>Cr&eacute;e un dossier <code>photos/AAAA-MM-JJ_titre/</code>, ' +
    'd&eacute;pose tes images dedans, puis lance <code>python3 build.py</code>.'));

function fail(html) {
  const el = document.createElement('div');
  el.id = 'empty';
  el.innerHTML = '<div>' + html + '</div>';
  app.appendChild(el);
}

function toISO(date) {
  const pad = n => String(n).padStart(2, '0');
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
}

function toDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function label(item) {
  return item.date === today ? "Aujourd'hui" : shortDate.format(toDate(item.date));
}

function start(list) {
  if (!list.length) return fail('Le dossier <code>photos/</code> est vide.');

  evenings = list;
  for (const item of evenings) {
    const button = document.createElement('button');
    button.appendChild(document.createTextNode(label(item)));
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = item.title || longDate.format(toDate(item.date));
    button.appendChild(sub);
    button.addEventListener('click', () => { pick(item); toggleMenu(false); });
    menu.appendChild(button);
  }

  pick(evenings.find(e => e.date >= today) || evenings[evenings.length - 1]);
}

function pick(item) {
  const isToday = item.date === today;

  pickerLabel.textContent = label(item);
  caption.textContent = item.title || longDate.format(toDate(item.date));
  [...menu.children].forEach((button, i) => {
    button.setAttribute('aria-current', evenings[i] === item ? 'true' : 'false');
  });

  if (item.screens) {
    loadScreens(item.screens)
      .then(all => showScreens(all, isToday))
      .catch(() => fail("Les &eacute;crans de cette soir&eacute;e n'ont pas pu &ecirc;tre charg&eacute;s."));
    return;
  }

  if (!item.poster) return showPlaceholder(item);

  showImages(isToday ? [item.poster].concat(item.detail) : [item.poster]);
}

function showPlaceholder(item) {
  mode = 'placeholder';
  stories = [];
  sections = [];
  allSections = [];
  index = 0;

  placeholderDate.textContent = longDate.format(toDate(item.date));
  placeholder.hidden = false;
  screensHost.hidden = true;
  frame.hidden = true;
  backdrop.hidden = true;
  arrows.hidden = true;
  taps.forEach(tap => { tap.hidden = true; });
  shades.forEach(shade => { shade.hidden = true; });
  caption.classList.add('dim');

  buildBars(1);
  bars.firstElementChild.classList.add('done');
}

async function loadScreens(url) {
  if (loaded.has(url)) return loaded.get(url);

  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error('screens');
  const doc = new DOMParser().parseFromString(await response.text(), 'text/html');

  for (const node of doc.head.querySelectorAll('link[rel="stylesheet"], link[rel="preconnect"], style')) {
    document.head.appendChild(node.cloneNode(true));
  }

  const holder = document.createElement('div');
  holder.dataset.source = url;
  for (const section of [...doc.body.querySelectorAll('section')]) holder.appendChild(section);
  screensHost.appendChild(holder);

  for (const script of doc.body.querySelectorAll('script')) {
    const el = document.createElement('script');
    el.textContent = script.textContent;
    document.body.appendChild(el);
  }

  const all = [...holder.children];
  loaded.set(url, all);
  return all;
}

function showScreens(all, isToday) {
  mode = 'screens';
  allSections = all;
  placeholder.hidden = true;
  sections = isToday ? all : all.slice(0, 1);
  stories = [];

  const holder = all[0].parentElement;
  for (const other of screensHost.children) other.hidden = other !== holder;

  screensHost.hidden = false;
  frame.hidden = true;
  backdrop.hidden = true;
  arrows.hidden = false;
  taps.forEach(tap => { tap.hidden = true; });
  shades.forEach(shade => { shade.hidden = true; });
  caption.classList.add('dim');

  buildBars(sections.length);
  show(0);
}

function showImages(list) {
  mode = 'images';
  stories = list;
  placeholder.hidden = true;
  sections = [];

  screensHost.hidden = true;
  frame.hidden = false;
  backdrop.hidden = false;
  arrows.hidden = true;
  taps.forEach(tap => { tap.hidden = false; });
  shades.forEach(shade => { shade.hidden = false; });
  caption.classList.remove('dim');

  buildBars(stories.length);
  show(0);
}

function buildBars(count) {
  bars.replaceChildren();
  for (let i = 0; i < count; i++) bars.appendChild(document.createElement('span'));
}

function show(i) {
  const count = mode === 'screens' ? sections.length : stories.length;
  if (i < 0 || i >= count) return;
  index = i;

  if (mode === 'screens') {
    for (const section of allSections) section.hidden = section !== sections[index];
    screensHost.scrollTop = 0;
    arrows.children[0].disabled = index === 0;
    arrows.children[1].disabled = index === count - 1;
  } else {
    frame.classList.add('swap');
    const image = new Image();
    image.onload = () => {
      frame.src = image.src;
      backdrop.style.backgroundImage = 'url("' + image.src + '")';
      frame.classList.remove('swap');
    };
    image.src = stories[index];
    if (stories[index + 1]) new Image().src = stories[index + 1];
  }

  [...bars.children].forEach((bar, n) => bar.classList.toggle('done', n <= index));
}

function toggleMenu(open) {
  const next = open === undefined ? menu.hidden : open;
  menu.hidden = !next;
  picker.setAttribute('aria-expanded', String(next));
}

picker.addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
document.addEventListener('click', () => toggleMenu(false));
menu.addEventListener('click', e => e.stopPropagation());

for (const tap of taps) {
  tap.addEventListener('click', () => show(index + (tap.classList.contains('left') ? -1 : 1)));
}
for (const arrow of arrows.children) {
  arrow.addEventListener('click', e => { e.stopPropagation(); show(index + Number(arrow.dataset.step)); });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(index - 1);
  if (e.key === 'ArrowRight') show(index + 1);
  if (e.key === 'Escape') toggleMenu(false);
});

let touch = null;
app.addEventListener('touchstart', e => {
  touch = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
}, { passive: true });
app.addEventListener('touchend', e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x;
  const dy = e.changedTouches[0].clientY - touch.y;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) show(index + (dx < 0 ? 1 : -1));
  touch = null;
}, { passive: true });
</script>

</body>
</html>
