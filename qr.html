<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    background: #fff;
    color: #111;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
  }
  #qr { display: flex; }
  #qr img, #qr canvas { width: min(70vw, 70vh); height: auto; image-rendering: pixelated; }
  #url {
    width: min(100%, 460px);
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    text-align: center;
  }
  p { margin: 0; color: #666; font-size: 0.9rem; text-align: center; }
  @media print {
    #url, p { display: none; }
    #qr img, #qr canvas { width: 16cm; }
  }
</style>
</head>
<body>

<div id="qr"></div>
<input id="url" type="url" spellcheck="false">
<p>Scanne avec l'appareil photo du téléphone. Ctrl+P pour imprimer.</p>

<script>
const input = document.getElementById('url');
const container = document.getElementById('qr');

input.value = location.href.replace(/qr\.html.*$/, '');

let qr = new QRCode(container, { text: input.value, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });

input.addEventListener('input', () => {
  container.innerHTML = '';
  if (!input.value.trim()) return;
  qr = new QRCode(container, { text: input.value.trim(), width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
});
</script>

</body>
</html>
